name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# PR runs are grouped by PR number, never by ref: a PR merged before its run
# starts is run against the base branch (ref refs/heads/master), which used
# to put it in master's group and cancel the master push run, skipping the
# release tag. Only PR runs cancel older runs; master runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; only the tag job gets write access.
permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt'ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  sqlc:
    name: sqlc generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Keep in sync with the version in internal/repo/dbgen headers.
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      # Fails when queries or migrations changed without `sqlc generate`.
      - name: sqlc diff
        run: sqlc diff

  build:
    name: Build release binary
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build linux/arm64 binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -ldflags="-s -w" -o dist/tsis1linux ./cmd/app

      - uses: actions/upload-artifact@v4
        with:
          name: tsis1linux-${{ github.sha }}
          path: dist/tsis1linux
          if-no-files-found: error

  ansible:
    name: Ansible lint & syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Ansible and ansible-lint
        run: pip install ansible-core ansible-lint

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      # The vault is not decrypted in CI: neither step needs the secrets.
      - name: Syntax check
        run: ansible-playbook site.yml --syntax-check

      - name: ansible-lint
        run: ansible-lint site.yml

  # Tags every green push to master with the next semver, so releases are
  # named v1.4.0 instead of a commit hash (the deploy playbook names
  # releases after `git describe`). The bump comes from the commits since
  # the last tag (conventional prefixes): "type!:" or "BREAKING CHANGE" ->
  # major, "feat:" -> minor, anything else -> patch.
  tag:
    name: Tag release
    runs-on: ubuntu-latest
    needs: [test, lint, sqlc, build, ansible]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    concurrency:
      group: tag-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags

      - name: Work out the next version
        id: version
        run: |
          set -euo pipefail
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "HEAD is already tagged: $(git tag --points-at HEAD | tr '\n' ' ')"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            range=HEAD; major=0; minor=0; patch=0
          else
            range="$last..HEAD"
            IFS=. read -r major minor patch <<< "${last#v}"
            minor=${minor:-0}; patch=${patch:-0}   # "v1" counts as v1.0.0
          fi

          log=$(git log "$range" --format='%s%n%b')
          if grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE' <<< "$log"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -qE '^feat(\([^)]*\))?:' <<< "$log"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi

          next="v$major.$minor.$patch"
          echo "last=${last:-none} next=$next"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # Annotated, so plain `git describe` (used by the deploy playbook) sees it.
      - name: Create and push the tag
        if: steps.version.outputs.skip == 'false'
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "Release $NEXT (${GITHUB_SHA::7})"
          git push origin "$NEXT"

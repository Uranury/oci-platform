# Local lab: one VirtualBox VM (NAT network) in the app group. No db host.
# Shares group_vars with inventory/ through symlinks; lab overrides live in
# host_vars/local-app.yml (host_vars beat group_vars).
#
#   ansible-playbook site.yml -i inventory-local/hosts.yml \
#     -e bootstrap_user=alee -e @<file with ansible_become_password> \
#     --skip-tags deploy,bootstrap_cleanup,verify
#
# Without a db host the API cannot reach PostgreSQL, so deploy and verify are
# skipped. No vault is needed: host_vars sets throwaway secrets.
all:
  vars:
    connect_user: "{{ bootstrap_user | default(admin_user) }}"
    ansible_user: "{{ connect_user }}"
  children:
    app:
      hosts:
        local-app:
          ansible_host: 10.0.2.3
          ansible_ssh_private_key_file: ~/.ssh/ansKeys
    db:
      hosts: {}

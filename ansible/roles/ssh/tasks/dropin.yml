---
# Also included by bootstrap_cleanup, which re-renders the file once the
# bootstrap group is gone.
- name: Read the groups that exist on this machine
  ansible.builtin.getent:
    database: group

# Only groups that exist are listed (deployers is absent on main-db, the
# bootstrap group disappears with the bootstrap user).
- name: Work out AllowGroups
  ansible.builtin.set_fact:
    ssh_allow_groups: >-
      {{ [admin_group, deploy_group, auditor_group, bootstrap_account]
         | select('in', ansible_facts.getent_group) | list }}

# sshd -t refuses to run without /run/sshd. On Ubuntu 24.04 sshd is
# socket-activated and the directory only exists while ssh.service is running
# (RuntimeDirectory), so it is missing when only ssh.socket is active, e.g.
# right after an openssh-server upgrade. It is a runtime directory, not
# configuration, so creating it is not reported as a change.
- name: Make sure the privilege separation directory exists for sshd -t
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"
  changed_when: false

- name: Install the sshd drop-in (checked with sshd -t before it goes live)
  ansible.builtin.template:
    src: 10-tsis1linux.conf.j2
    dest: /etc/ssh/sshd_config.d/10-tsis1linux.conf
    owner: root
    group: root
    mode: "0644"
    validate: sshd -t -f %s
  notify: Reload ssh

- name: Apply the new sshd settings now
  ansible.builtin.meta: flush_handlers

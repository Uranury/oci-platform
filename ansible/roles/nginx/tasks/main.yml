---
# Replaces the manual nginx install (SIS #1) and the site from setup-fs.sh app.
# With tls_enabled it also gets a Let's Encrypt certificate (certificate.yml).
# The site template only adds the HTTPS server once the certificate exists, so
# the first run serves the HTTP-01 challenge over plain HTTP, gets the
# certificate, then rewrites the site.
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Create the ACME challenge directory
  ansible.builtin.file:
    path: "{{ tls_webroot }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: tls_enabled | bool

- name: Look for the certificate
  ansible.builtin.stat:
    path: /etc/letsencrypt/live/{{ tls_cert_name }}/fullchain.pem
  register: nginx_cert

- name: Decide whether the site serves HTTPS
  ansible.builtin.set_fact:
    nginx_tls_ready: "{{ (tls_enabled | bool) and nginx_cert.stat.exists }}"

- name: Install and enable the site
  ansible.builtin.include_tasks: site.yml

- name: Disable the default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Start nginx and enable it at boot
  ansible.builtin.systemd_service:
    name: nginx
    state: started
    enabled: true

- name: Check the nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Get the certificate
  ansible.builtin.include_tasks: certificate.yml
  when: tls_enabled | bool

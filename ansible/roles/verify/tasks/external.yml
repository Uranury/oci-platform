---
# Runs on the controller (the laptop): closed-port checks only prove something
# from outside. Port of local/scripts/smoke.sh.
- name: Set the target address
  ansible.builtin.set_fact:
    verify_ip: "{{ hostvars[groups['app'][0]].ansible_host }}"
    verify_base: "http://{{ hostvars[groups['app'][0]].ansible_host }}"
    verify_email: "smoke-{{ now(utc=true).strftime('%Y%m%d%H%M%S') }}-{{ 100000 | random }}@example.com"
    verify_username: "smoke-{{ 100000 | random }}"
    verify_password: "Smoke-{{ 100000 | random }}-test"

- name: "Ports: open from the internet"
  ansible.builtin.wait_for:
    host: "{{ verify_ip }}"
    port: "{{ item }}"
    state: started
    timeout: 10
  loop: [22, 80]

- name: "Ports: closed from the internet (nothing answers)"
  ansible.builtin.wait_for:
    host: "{{ verify_ip }}"
    port: "{{ item }}"
    state: stopped
    connect_timeout: 3
    timeout: 15
  loop: [443, 8080, 5432]

# The server must offer publickey and nothing else.
- name: "SSH: password login is refused"
  ansible.builtin.command: >-
    ssh -o BatchMode=yes -o ConnectTimeout=5 -o PubkeyAuthentication=no
    -o PreferredAuthentications=password,keyboard-interactive
    -o StrictHostKeyChecking=accept-new nobody@{{ verify_ip }} true
  register: verify_pwlogin
  changed_when: false
  failed_when: verify_pwlogin.stderr is not search('Permission denied \(publickey\)')

- name: "SSH: look for the deploy bot key on this laptop"
  ansible.builtin.stat:
    path: "{{ deploy_ssh_key | expanduser }}"
  register: verify_deploy_key

- name: "SSH: the deploy bot logs in with its key, can write releases, has no sudo"
  ansible.builtin.command: >-
    ssh -o BatchMode=yes -o ConnectTimeout=5 -o IdentitiesOnly=yes
    -i {{ deploy_ssh_key | expanduser }} {{ deploy_user }}@{{ verify_ip }}
    'test -w {{ app_dir }}/releases && ! sudo -n true 2>/dev/null'
  changed_when: false
  when: verify_deploy_key.stat.exists

- name: "API: GET /healthz through nginx"
  ansible.builtin.uri:
    url: "{{ verify_base }}/healthz"

- name: "API: register"
  ansible.builtin.uri:
    url: "{{ verify_base }}/auth/register"
    method: POST
    body_format: json
    body: { username: "{{ verify_username }}", email: "{{ verify_email }}", password: "{{ verify_password }}" }
    status_code: 201

- name: "API: login"
  ansible.builtin.uri:
    url: "{{ verify_base }}/auth/login"
    method: POST
    body_format: json
    body: { email: "{{ verify_email }}", password: "{{ verify_password }}" }
  register: verify_login
  no_log: true

- name: "API: login returns both tokens"
  ansible.builtin.assert:
    that:
      - verify_login.json.access_token | default('') | length > 0
      - verify_login.json.refresh_token | default('') | length > 0
    quiet: true

- name: "Frontend: GET / serves the web app"
  ansible.builtin.uri:
    url: "{{ verify_base }}/"
    return_content: true
  register: verify_frontend

# The page is the Vite build (web/dist/app), not the "frontend not built"
# placeholder a binary compiled without `npm run build` serves.
- name: "Frontend: the page is the built workout tracker"
  ansible.builtin.assert:
    that:
      - verify_frontend.content_type is search('text/html')
      - "'<title>Lift Log</title>' in verify_frontend.content"
      - "'Frontend not built' not in verify_frontend.content"
      - verify_frontend.content is search('/assets/index-[A-Za-z0-9_-]+[.]js')
    quiet: true

- name: "Frontend: GET the hashed script the page references"
  ansible.builtin.uri:
    url: "{{ verify_base }}{{ verify_frontend.content | regex_search('/assets/index-[A-Za-z0-9_-]+[.]js') }}"
  register: verify_frontend_js

- name: "Frontend: the script is JavaScript, cached for good"
  ansible.builtin.assert:
    that:
      - verify_frontend_js.content_type is search('javascript')
      - verify_frontend_js.cache_control | default('') is search('immutable')
    quiet: true

- name: "API: GET /workouts without a token is 401"
  ansible.builtin.uri:
    url: "{{ verify_base }}/workouts"
    status_code: 401

- name: "API: create an exercise"
  ansible.builtin.uri:
    url: "{{ verify_base }}/exercises"
    method: POST
    headers:
      Authorization: "Bearer {{ verify_login.json.access_token }}"
    body_format: json
    body:
      name: "{{ verify_exercise_name }}"
      movement_pattern: horizontal_push
      primary_muscle: chest
      secondary_muscles: [triceps]
      mechanic: compound
      equipment: barbell
      tracking_type: weight_reps
    status_code: 201
  register: verify_exercise
  no_log: true

- name: "API: list exercises"
  ansible.builtin.uri:
    url: "{{ verify_base }}/exercises"
    headers:
      Authorization: "Bearer {{ verify_login.json.access_token }}"
  register: verify_exercises
  no_log: true

- name: "API: the seeded library is there next to the custom exercise"
  ansible.builtin.assert:
    that:
      - (verify_exercises.json | selectattr('slug', 'defined') | map(attribute='slug') | list) is superset(['bench-press', 'back-squat', 'pull-up'])
      - verify_exercise_name in (verify_exercises.json | rejectattr('system') | map(attribute='name') | list)
    quiet: true

- name: "API: a default exercise is read-only"
  ansible.builtin.uri:
    url: "{{ verify_base }}/exercises/{{ (verify_exercises.json | selectattr('slug', 'defined') | selectattr('slug', 'equalto', 'pull-up') | first).id }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ verify_login.json.access_token }}"
    status_code: 403
  no_log: true

- name: "API: create a workout"
  ansible.builtin.uri:
    url: "{{ verify_base }}/workouts"
    method: POST
    headers:
      Authorization: "Bearer {{ verify_login.json.access_token }}"
    body_format: json
    body: { name: "{{ verify_workout_name }}" }
    status_code: 201
  register: verify_workout
  no_log: true

- name: "API: log a set"
  ansible.builtin.uri:
    url: "{{ verify_base }}/workouts/{{ verify_workout.json.id }}/sets"
    method: POST
    headers:
      Authorization: "Bearer {{ verify_login.json.access_token }}"
    body_format: json
    body:
      exercise_id: "{{ verify_exercise.json.id }}"
      reps: 5
      weight_kg: 62.5
    status_code: 201
  no_log: true

- name: "API: log a bodyweight set on the seeded pull-up"
  ansible.builtin.uri:
    url: "{{ verify_base }}/workouts/{{ verify_workout.json.id }}/sets"
    method: POST
    headers:
      Authorization: "Bearer {{ verify_login.json.access_token }}"
    body_format: json
    body:
      exercise_id: "{{ (verify_exercises.json | selectattr('slug', 'defined') | selectattr('slug', 'equalto', 'pull-up') | first).id }}"
      reps: 8
    status_code: 201
  no_log: true

- name: "API: list workouts"
  ansible.builtin.uri:
    url: "{{ verify_base }}/workouts"
    headers:
      Authorization: "Bearer {{ verify_login.json.access_token }}"
  register: verify_workouts
  no_log: true

- name: "API: get the workout with its sets"
  ansible.builtin.uri:
    url: "{{ verify_base }}/workouts/{{ verify_workout.json.id }}"
    headers:
      Authorization: "Bearer {{ verify_login.json.access_token }}"
  register: verify_workout_detail
  no_log: true

- name: "API: the list shows the workout and the set reads back intact"
  ansible.builtin.assert:
    that:
      - verify_workout.json.id in (verify_workouts.json | map(attribute='id') | list)
      - verify_workout_detail.json.sets | length == 2
      - verify_workout_detail.json.sets[0].exercise_name == verify_exercise_name
      - verify_workout_detail.json.sets[0].reps == 5
      - verify_workout_detail.json.sets[0].weight_kg | float == 62.5
      - verify_workout_detail.json.sets[1].exercise_name == 'Pull-up'
      - verify_workout_detail.json.sets[1].weight_kg is none
    quiet: true

- name: "API: delete the workout"
  ansible.builtin.uri:
    url: "{{ verify_base }}/workouts/{{ verify_workout.json.id }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ verify_login.json.access_token }}"
    status_code: 204
  no_log: true

- name: "API: the deleted workout is gone"
  ansible.builtin.uri:
    url: "{{ verify_base }}/workouts/{{ verify_workout.json.id }}"
    headers:
      Authorization: "Bearer {{ verify_login.json.access_token }}"
    status_code: 404
  no_log: true

- name: "API: logout"
  ansible.builtin.uri:
    url: "{{ verify_base }}/auth/logout"
    method: POST
    body_format: json
    body: { refresh_token: "{{ verify_login.json.refresh_token }}" }
    status_code: [200, 204]
  no_log: true

- name: "API: the revoked refresh token is rejected"
  ansible.builtin.uri:
    url: "{{ verify_base }}/auth/refresh"
    method: POST
    body_format: json
    body: { refresh_token: "{{ verify_login.json.refresh_token }}" }
    status_code: 401
  no_log: true

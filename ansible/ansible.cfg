[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Host keys ARE checked. New hosts are accepted on first contact through
# StrictHostKeyChecking=accept-new in ssh_args below; a changed key still fails.
host_key_checking = True
interpreter_python = /usr/bin/python3
forks = 5
nocows = True
callback_result_format = yaml

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
# Pipelining sends modules over the open SSH session instead of copying them
# to a temp file. Faster, and it lets become_user switch to unprivileged
# accounts (postgres, deploy) without world-readable temp files.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new

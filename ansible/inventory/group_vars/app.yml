---
admin_pubkey_file: keys/admin-mainapp.pub
deploy_pubkey_file: keys/deploy.pub

firewall_rules:
  - tcp dport 22 accept
  - tcp dport 80 accept    # ACME challenge + redirect to HTTPS
  - tcp dport 443 accept

# HTTPS (nginx role): a Let's Encrypt certificate for tls_domains, the first
# being the canonical name the others redirect to. The DNS records must point
# at app_public_ip before the first run.
#   -e tls_staging=true   use Let's Encrypt staging (untrusted certificate,
#                         no rate limits) for a first try; the next run
#                         without it replaces it with a real one
tls_enabled: true
tls_domains: [overlift.xyz, www.overlift.xyz]
tls_cert_name: "{{ tls_domains[0] }}"
tls_staging: false
tls_webroot: /var/www/letsencrypt
# Short while HTTPS is new: browsers remember it for this long (seconds).
# Raise to 31536000 once it has run without trouble.
tls_hsts_max_age: 300
# verify fails when the certificate has fewer days left (certbot renews at 30)
tls_min_days_left: 21

# packages role (SIS #3)
pg_client_version: 17
hurl_version: 8.0.1
hurl_sha256:   # per ansible_facts.architecture
  aarch64: bc4732df4754748e9bf296aa3832ec019f798afb399f1279b72ed37b6e04525c
  x86_64: cac7c4670d69444db120edb21fe06c97ba8c80dcc52279957c8dd18f05fb0c06
# The upstream hurl binaries link libxml2.so.2, which Ubuntu 26.04 no longer
# ships (libxml2.so.16). true: install the distro's hurl package instead.
hurl_from_archive: false

# deploy_release role
deploy_release_keep: 5

---
# Two OCI VMs. Update the public IP (and the private IPs in group_vars/all.yml)
# whenever the VMs are recreated.
#
# Who Ansible logs in as:
#   first run on a fresh VM:  -e bootstrap_user=ubuntu   (the cloud image login)
#   every later run:          the admin account (alibi), created by the playbook
# The same SSH key is used for both accounts on a machine: it is the key chosen
# when the VM was created in the OCI console, and the playbook authorizes it
# for alibi as well.
all:
  vars:
    connect_user: "{{ bootstrap_user | default(admin_user) }}"
    jump_user: "{{ bootstrap_user | default(admin_user) }}"
    ansible_user: "{{ connect_user }}"
    app_public_ip: 92.5.116.46
    app_ssh_key: ~/.ssh/mainapp_keys
    db_ssh_key: ~/.ssh/maindbprivate.key
  children:
    app:
      hosts:
        mainapp:
          ansible_host: "{{ app_public_ip }}"
          ansible_ssh_private_key_file: "{{ app_ssh_key }}"
    db:
      hosts:
        main-db:
          ansible_host: "{{ db_private_ip }}"
          ansible_ssh_private_key_file: "{{ db_ssh_key }}"
          # main-db has no public IP: hop through mainapp. This is the
          # ProxyCommand form of ProxyJump, because -o ProxyJump cannot be
          # given the jump host's key on the command line (ssh applies
          # command-line options to the destination only).
          ansible_ssh_common_args: >-
            -o ProxyCommand="ssh -W %h:%p -q -i {{ app_ssh_key }}
            -o IdentitiesOnly=yes -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            {{ jump_user }}@{{ app_public_ip }}"

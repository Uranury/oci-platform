# sqlc: generates typed Go for the SQL in internal/repo/queries, checked
# against the schema built from migrations/ (golang-migrate .up.sql files;
# .down.sql are ignored). Regenerate with `sqlc generate`; CI fails if the
# generated code is stale (`sqlc diff`). Pinned version: see ci.yml.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/repo/queries
    gen:
      go:
        package: dbgen
        out: internal/repo/dbgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          # Plain Go types instead of pgtype wrappers, matching internal/models.
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: pg_catalog.int4
            go_type: int
          - db_type: pg_catalog.int4
            nullable: true
            go_type:
              type: int
              pointer: true
          - db_type: pg_catalog.numeric
            go_type: float64
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              type: float64
              pointer: true
          # Exercise categories use the enum types from models, so the
          # CHECK-constrained TEXT columns can't be mixed up with each other.
          - column: exercises.movement_pattern
            go_type: github.com/Uranury/oci-platform/internal/models.MovementPattern
          - column: exercises.primary_muscle
            go_type: github.com/Uranury/oci-platform/internal/models.Muscle
          - column: exercises.secondary_muscles
            go_type:
              import: github.com/Uranury/oci-platform/internal/models
              type: Muscle
              slice: true
          - column: exercises.mechanic
            go_type: github.com/Uranury/oci-platform/internal/models.Mechanic
          - column: exercises.equipment
            go_type: github.com/Uranury/oci-platform/internal/models.Equipment
          - column: exercises.tracking_type
            go_type: github.com/Uranury/oci-platform/internal/models.TrackingType
